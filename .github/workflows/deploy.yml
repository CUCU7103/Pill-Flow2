# main 배포: 백엔드 트리 해시 태그 → 빌드(없을 때만) → 마이그레이션 → EC2 배포 → 스모크
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "배포할 기존 이미지 태그(비우면 현재 커밋을 빌드)"
        required: false
        default: ""
      migrate_only:
        description: "마이그레이션만 실행(배포 생략)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1

jobs:
  changes:
    # 수동 실행(main 한정)이거나, 자동 배포가 켜져 있고 main push의 CI가 성공한 경우에만 진행한다.
    # 이 조건을 통과하면 항상 배포를 진행한다(deploy=true) — 마지막 성공 run의 headSha 기준
    # git diff로 변경 여부를 가리는 방식은 workflow_run의 headSha가 "트리거 시점 main HEAD"라
    # 실제 배포된 커밋과 다를 수 있어(migrate_only·image_tag 수동 실행도 성공으로 기록됨)
    # 빠른 연속 push에서 백엔드 변경이 조용히 누락되는 경합이 있었다. 대신 이미지 태그를
    # backend 트리 해시로 바꿔, 백엔드가 안 바뀐 실행은 build/migrate 단계 자체가
    # 자연스럽게 아무 일도 하지 않도록(이미지 존재 → 빌드 생략) 한다.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (vars.AUTO_DEPLOY_ENABLED == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.detect.outputs.deploy }}
      sha: ${{ steps.detect.outputs.sha }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: detect
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          if [[ -n "$INPUT_TAG" ]]; then
            # 수동으로 지정한 기존 이미지 태그 — 셸에 그대로 삽입되므로 형식을 검증한다.
            # 입력값 자체는 로그에 남기지 않는다(형식 위반 사유만 알린다).
            if [[ ! "$INPUT_TAG" =~ ^[A-Za-z0-9._-]{1,128}$ ]]; then
              echo "잘못된 image_tag 입력: 허용 문자(영문/숫자/./_/-)와 128자 제한을 벗어났다" >&2
              exit 1
            fi
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            # 태그 = backend 디렉토리 트리 해시(커밋 SHA 대신). backend/가 바뀌지 않은 push는
            # 같은 트리 해시가 나와 build가 "이미지 이미 존재"로 건너뛰고, migrate는 적용할
            # 변경이 없으며, deploy도 같은 이미지로 컨테이너가 유지된 채 compose.yml/Caddyfile
            # 등 배포 스크립트 변경만 반영된다. 별도 줄로 계산해 실패 시 단계 자체가 중단되게 한다.
            tag="$(git rev-parse --verify "$HEAD_SHA:backend")"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.deploy == 'true' && inputs.image_tag == ''
    runs-on: ubuntu-24.04-arm
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: 이미지 빌드·push (이미 있으면 건너뜀 — 불변 태그 재실행 대비)
        env:
          REPO_URI: ${{ vars.ECR_REPOSITORY_URI }}
          TAG: ${{ needs.changes.outputs.tag }}
        run: |
          set -o pipefail
          if error="$(aws ecr describe-images --repository-name "${REPO_URI##*/}" --image-ids imageTag="$TAG" 2>&1 1>/dev/null)"; then
            echo "이미지가 이미 존재함: $TAG — 빌드 생략"; exit 0
          elif [[ "$error" == *ImageNotFoundException* ]]; then
            echo "이미지 없음: $TAG — 빌드 진행"
          else
            echo "$error" >&2
            exit 1
          fi
          docker build -t "$REPO_URI:$TAG" backend
          docker push "$REPO_URI:$TAG"

  migrate:
    needs: [changes, build]
    if: "!cancelled() && needs.changes.outputs.deploy == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped')"
    runs-on: ubuntu-24.04-arm
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Flyway 마이그레이션 (migrate 프로파일)
        env:
          REPO_URI: ${{ vars.ECR_REPOSITORY_URI }}
          TAG: ${{ needs.changes.outputs.tag }}
        run: |
          set -o pipefail
          env_file="$(mktemp)"; chmod 600 "$env_file"
          trap 'rm -f "$env_file"' EXIT
          aws ssm get-parameters-by-path --path /pillflow/prod/migration/ --with-decryption --output json \
            | jq -r '.Parameters[] | "\(.Name | split("/") | last)=\(.Value)"' > "$env_file"
          # 로그에 비밀번호가 찍히지 않도록 마스킹한다.
          while IFS='=' read -r _ value; do echo "::add-mask::$value"; done < <(grep '^FLYWAY_PASSWORD=' "$env_file")
          docker run --rm --env-file "$env_file" -e SPRING_PROFILES_ACTIVE=migrate "$REPO_URI:$TAG"

  deploy:
    needs: [changes, migrate]
    if: "!cancelled() && needs.migrate.result == 'success' && inputs.migrate_only != true"
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: EC2 배포 (SSM Run Command)
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          REPO_URI: ${{ vars.ECR_REPOSITORY_URI }}
          TAG: ${{ needs.changes.outputs.tag }}
        run: infra/deploy/send-deploy.sh "$INSTANCE_ID" "$REPO_URI" "$TAG"

  smoke:
    needs: deploy
    if: "!cancelled() && needs.deploy.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 헬스체크
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS --max-time 10 https://api.pillflow.app/actuator/health | grep -q '"status":"UP"'; then echo "UP"; exit 0; fi
            sleep 5
          done
          echo "스모크 테스트 실패"; exit 1
