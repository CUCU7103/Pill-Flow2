<svg width="180" height="180" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 배경: 앱 액션 색(#1B64DA) 기준의 세로 그라데이션 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1B64DA"/>
    </linearGradient>
    <!-- 캡슐 외곽: 절반씩 색을 나누기 위한 클립 -->
    <clipPath id="capsule">
      <rect x="21" y="9" width="22" height="46" rx="11"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 45도로 기울인 두 가지 색 캡슐 알약 -->
  <g transform="rotate(45 32 32)">
    <g clip-path="url(#capsule)">
      <rect x="21" y="9" width="22" height="23" fill="#FFFFFF"/>
      <rect x="21" y="32" width="22" height="23" fill="#BFDBFE"/>
    </g>
    <!-- 캡슐 이음새 -->
    <rect x="21" y="31" width="22" height="2" fill="#1B64DA" opacity="0.35"/>
    <!-- 아랫부분 광택 -->
    <rect x="26" y="36" width="4" height="12" rx="2" fill="#FFFFFF" opacity="0.7"/>
  </g>
</svg>
